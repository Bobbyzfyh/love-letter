# Netlify 部署配置（Netlify 会自动读取这个文件）
[build]
  command = "npm run build"
  publish = "dist"

# 打包出来的 assets 文件名带哈希，可以长期缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 音乐和照片文件名不带哈希（我以后可能会直接替换同名文件），缓存短一点
[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
